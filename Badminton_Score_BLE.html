<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>羽球計分板 BLE 遙控器</title>
  <style>
    body { background: #121212; color: #eee; font-family: sans-serif; text-align: center; margin: 0; padding: 15px; }
    .card { background: #2a2a2a; margin-bottom: 12px; padding: 20px; border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
    button {
      padding: 20px; margin: 5px; border-radius: 12px; border: none; cursor: pointer; font-weight: bold; transition: 0.1s;
      touch-action: manipulation; -webkit-user-select: none; user-select: none;
    }
    button:active { transform: scale(0.92); }
    .btn-sc { width: 45%; font-size: 2.5rem; color: white; }
    .btn-sub { width: 45%; font-size: 1.5rem; color: #ccc; padding: 15px; margin-top: 5px; }
    #connectBtn { width: 95%; background: #007bff; color: white; font-size: 1.5rem; border-radius: 15px; box-shadow: 0 0 15px rgba(0,123,255,0.4); margin-bottom: 10px; }
    .btn-setup { width: 95%; background: #17a2b8; color: white; font-size: 1.2rem; margin-bottom: 20px; border-radius: 15px;}
  </style>
</head>
<body>

  <button id="connectBtn" onclick="connectBLE()">📡 點我尋找計分板並連線</button>
  
  <button class="btn-setup" onclick="enterSetupMode()">⚙️ 切換至 WiFi 設定模式</button>

  <button id="btn-voice" style="width: 90%; background: #444; color: white; font-size: 1.5rem; border-radius: 15px; margin-bottom: 5px; border: 2px solid #666; display: block; margin: 0 auto 5px auto;" onclick="toggleVoiceRecognition()">🎤 點我啟動語音控制</button>
  <div id="v-text" style="text-align: center; color: #ffc107; font-size: 1.1rem; margin-bottom: 15px; min-height: 25px;"></div>
  <div class="card">
    <div style="font-size:1.2rem; color:#888; margin-bottom:15px;">計分控制區</div>
    <div>
      <button class="btn-sc" style="background:#dc3545;" onclick="sendCmd('A')">A +1</button>
      <button class="btn-sc" style="background:#28a745;" onclick="sendCmd('B')">B +1</button>
    </div>
    <div>
      <button class="btn-sub" style="background:#6c1922;" onclick="sendCmd('A-')">A -1</button>
      <button class="btn-sub" style="background:#165c26;" onclick="sendCmd('B-')">B -1</button>
    </div>
    <button style="width:92%; background:#555; color:white; margin-top:25px; font-size:1.2rem;" onclick="sendCmd('R')">🔄 重設分數</button>
  </div>

  <script>
    const SERVICE_UUID = "6e400001-b5a3-f393-e0a9-e50e24dcca9e";
    const CHARACTERISTIC_UUID_RX = "6e400002-b5a3-f393-e0a9-e50e24dcca9e";
    let bleDevice; let bleServer; let rxCharacteristic;

    async function connectBLE() {
      try {
        const btn = document.getElementById('connectBtn'); btn.innerText = '搜尋中...';
        bleDevice = await navigator.bluetooth.requestDevice({ filters: [{ name: 'Badminton_Score_BLE' }], optionalServices: [SERVICE_UUID] });
        bleServer = await bleDevice.gatt.connect();
        const service = await bleServer.getPrimaryService(SERVICE_UUID);
        rxCharacteristic = await service.getCharacteristic(CHARACTERISTIC_UUID_RX);
        btn.innerText = '✅ 已成功連線'; btn.style.background = '#28a745'; btn.style.boxShadow = '0 0 15px rgba(40,167,69,0.5)';
        bleDevice.addEventListener('gattserverdisconnected', onDisconnected);
      } catch (error) {
        console.error(error); document.getElementById('connectBtn').innerText = '❌ 連線失敗，請重試'; document.getElementById('connectBtn').style.background = '#dc3545';
      }
    }

    function onDisconnected() {
      const btn = document.getElementById('connectBtn');
      btn.innerText = '⚠️ 已斷線，點我重新連線'; btn.style.background = '#ffc107'; btn.style.color = '#000'; rxCharacteristic = null;
    }

    async function sendCmd(cmd) {
      if (!rxCharacteristic) { alert('請先點擊上方按鈕連線藍牙！'); return; }
      try {
        let encoder = new TextEncoder();
        await rxCharacteristic.writeValue(encoder.encode(cmd));
        if (navigator.vibrate) navigator.vibrate(50);
      } catch (error) { console.error("發送失敗", error); }
    }

    // 🟢 呼叫切換設定模式的功能
    function enterSetupMode() {
      if (!rxCharacteristic) { alert('請先連線藍牙，才能發送切換指令！'); return; }
      if(confirm("即將關閉藍牙計分模式，並重啟為 WiFi 設定基地台。確定嗎？")) {
        sendCmd('SETUP');
        alert("指令已發送！請稍候 3 秒，然後用手機連接名為「Badminton_Setup」的 WiFi，密碼 12345678。連上後開啟瀏覽器輸入 192.168.4.1");
      }
    }

    // ==========================================
    // 🎤 語音辨識模組 (藍牙版 - 最初極簡穩定版)
    // ==========================================
    let recognition;
    let isRecognizing = false;
    let keepListening = false; // 新增：用來控制是否要一直自動重啟

    function initSpeech() {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (SpeechRecognition) {
        recognition = new SpeechRecognition();
        recognition.continuous = true; // 開啟持續聆聽 (盡可能讓瀏覽器保持)
        recognition.interimResults = true; // 開啟即時回饋，用來在吵雜環境中提前攔截
        recognition.lang = 'zh-TW';

        recognition.onstart = function() {
          isRecognizing = true;
          document.getElementById('v-text').innerText = '正在開啟麥克風...';
          document.getElementById('v-text').style.color = '#aaa';
          const btn = document.getElementById('btn-voice');
          btn.style.background = '#ff8800'; // 橘色表示準備中
          btn.style.borderColor = '#cc6600';
          btn.innerText = '⏳ 正在開啟麥克風硬體...';
        };

        recognition.onaudiostart = function() {
          const btn = document.getElementById('btn-voice');
          btn.style.background = '#ff3333'; // 紅色表示收音中
          btn.style.borderColor = '#ff0000';
          btn.innerText = '🔴 麥克風已啟動，請說話...';
          document.getElementById('v-text').innerText = '(請說出指令)';
        };

        recognition.onsoundstart = function() {
          document.getElementById('v-text').innerText = '(有收到聲音，辨識中...)';
        };

        recognition.onerror = function(event) {
          console.error("語音錯誤: ", event.error);
          document.getElementById('v-text').innerText = '⚠️ 發生錯誤: ' + event.error;
          document.getElementById('v-text').style.color = '#dc3545';
          if (event.error === 'not-allowed' || event.error === 'service-not-allowed') {
             keepListening = false; // 發生致命錯誤，強制停止無窮迴圈
          }
        };

        recognition.onend = function() {
          isRecognizing = false;
          if (keepListening) {
             document.getElementById('v-text').innerText = '🔄 自動重啟收音中...';
             document.getElementById('v-text').style.color = '#ffc107';
             try { recognition.start(); } catch(e) { console.error("重啟失敗", e); }
          } else {
             const btn = document.getElementById('btn-voice');
             btn.style.background = '#444';
             btn.style.borderColor = '#666';
             btn.innerText = '🎤 點我啟動語音控制';
          }
        };

        recognition.onresult = function(event) {
          let interimTranscript = '';
          let finalTranscript = '';

          for (let i = event.resultIndex; i < event.results.length; ++i) {
            if (event.results[i].isFinal) {
              finalTranscript += event.results[i][0].transcript;
            } else {
              interimTranscript += event.results[i][0].transcript;
            }
          }
          
          let transcriptToCheck = interimTranscript !== '' ? interimTranscript.trim() : finalTranscript.trim();
          
          if (transcriptToCheck !== '') {
             document.getElementById('v-text').innerText = '聽到: ' + transcriptToCheck;
             document.getElementById('v-text').style.color = '#0ff';
          }

          if (transcriptToCheck !== '') {
            let matched = false;
            let cmd = '';
            if (transcriptToCheck.includes('A隊加分') || transcriptToCheck.includes('紅隊加分') || transcriptToCheck.includes('左邊加分')) {
              cmd = 'A'; matched = true;
            } else if (transcriptToCheck.includes('B隊加分') || transcriptToCheck.includes('綠隊加分') || transcriptToCheck.includes('右邊加分')) {
              cmd = 'B'; matched = true;
            } else if (transcriptToCheck.includes('A隊減分') || transcriptToCheck.includes('左邊減分') || transcriptToCheck.includes('紅隊減分')) {
              cmd = 'A-'; matched = true;
            } else if (transcriptToCheck.includes('B隊減分') || transcriptToCheck.includes('右邊減分') || transcriptToCheck.includes('綠隊減分')) {
              cmd = 'B-'; matched = true;
            } else if (transcriptToCheck.includes('分數歸零') || transcriptToCheck.includes('重新開始')) {
              cmd = 'R'; matched = true;
            }

            if (matched) {
               if (!rxCharacteristic) {
                  document.getElementById('v-text').innerText += ' ⚠️(藍牙未連線)';
                  document.getElementById('v-text').style.color = '#dc3545';
                  recognition.stop();
                  return;
               }
               sendCmd(cmd);
               document.getElementById('v-text').innerText += ' ✅(已發送)';
               document.getElementById('v-text').style.color = '#28a745';
               // 攔截到指令，立刻主動關閉麥克風，完成本次輸入
               recognition.stop();
            } else if (finalTranscript !== '') {
               // 整句話結尾了還是沒命中
               document.getElementById('v-text').innerText += ' ❌(無效指令)';
               document.getElementById('v-text').style.color = '#dc3545';
               recognition.stop();
            }
          }
        };

      } else {
        alert('您的瀏覽器不支援語音辨識！請使用手機版 Chrome 或 Safari。');
      }
    }


    function toggleVoiceRecognition() {
      if (!recognition) initSpeech();
      if (!recognition) return;

      if (isRecognizing || keepListening) {
        keepListening = false; // 關閉自動重啟
        recognition.stop();
        const btn = document.getElementById('btn-voice');
        btn.style.background = '#444';
        btn.style.borderColor = '#666';
        btn.innerText = '🎤 點我啟動語音控制';
        document.getElementById('v-text').innerText = '⏹️ 語音已手動關閉';
      } else {
        keepListening = true; // 開啟自動重啟
        try { recognition.start(); } catch(e) { console.error(e); }
      }
    }
  </script>
</body>
</html>
